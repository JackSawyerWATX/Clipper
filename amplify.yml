version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install --silent --global expo-cli
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: web-build
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - $(npm root --global)/**/*